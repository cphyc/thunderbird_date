<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Date detector settings</title>
  <link rel="stylesheet" href="options.css">
  <script src="options.js" defer></script>
</head>
<body>
  <main>
    <h1>Date detector settings</h1>
    <p>Select the languages to use when detecting dates in email messages.</p>
    <p>All supported languages are enabled by default. Changes apply to messages opened after saving.</p>
    <form id="language-form">
      <fieldset>
        <legend>Detection languages</legend>
        <div id="language-list"></div>
      </fieldset>
      <div class="actions">
        <button type="button" id="select-all">Select all</button>
        <button type="button" id="deselect-all">Deselect all</button>
        <button type="submit">Save</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
